[workspace]
resolver = "2"
members = [
  "crates/calendar-server",
  "crates/calendar-core",
  "crates/calendar-db",
  "crates/calendar-api",
  "crates/calendar-caldav",
  "crates/calendar-auth",
  "crates/calendar-rules",
  "crates/calendar-notify",
  "crates/calendar-web",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Calendar Server Contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
http = "1"
icalendar = { version = "0.17", features = ["parser", "chrono-tz"] }
jsonwebtoken = "9"
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
futures-util = "0.3"
bytes = "1"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
dav-server = { version = "0.11", features = ["caldav"] }
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-rs = "0.5"
totp-rs = { version = "5", default-features = false, features = ["otpauth", "gen_secret"] }
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
chrono-tz = { version = "0.10", features = ["serde"] }
sha2 = "0.10"
rand_core = { version = "0.9", features = ["os_rng"] }
ammonia = "4"
reqwest ={ version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1"] }
