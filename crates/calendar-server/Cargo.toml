[package]
name = "calendar-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "calendar-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
calendar-core = { path = "../calendar-core" }
calendar-db = { path = "../calendar-db" }
calendar-caldav = { path = "../calendar-caldav" }
calendar-carddav = { path = "../calendar-carddav" }
calendar-auth = { path = "../calendar-auth" }
calendar-rules = { path = "../calendar-rules" }
calendar-notify = { path = "../calendar-notify" }
calendar-web = { path = "../calendar-web" }
base64.workspace = true
dav-server.workspace = true
xmltree.workspace = true
bytes.workspace = true
http.workspace = true
futures-util.workspace = true
webauthn-rs.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
sqlx.workspace = true
uuid.workspace = true
thiserror.workspace = true
dotenvy.workspace = true
reqwest.workspace = true

# web-push (ece) and webauthn-attestation-ca pull openssl unconditionally; for
# musl release builds vendor it so the binary stays fully static.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
