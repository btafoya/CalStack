name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d calendar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # DB-backed unit tests (migration upgrade, backup round-trip, If-Match
      # race, notification claim) run against the service container.
      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d calendar -c "CREATE DATABASE caldbtest"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d calendar -c "CREATE DATABASE caltest"
      - name: Workspace tests (with live PostgreSQL)
        run: cargo test --workspace --all-features
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/caldbtest
          CALENDAR_DB_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/caldbtest
      # Full protocol suite against the same service container. cargo test
      # only builds the server bin in test mode (target/debug/deps), never as
      # target/debug/calendar-server — link it for the suite to drive.
      - name: Interop suite
        run: cargo build --bin calendar-server && tests/interop/run.sh
        env:
          EXTERNAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/caltest
