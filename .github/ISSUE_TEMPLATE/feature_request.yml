name: Feature request
description: Propose an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks it? Existing workarounds?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: standards
    attributes:
      label: Standards relevance
      description: Daymark prioritizes standards-compliant behavior. If this touches CalDAV/CardDAV/iCalendar behavior, cite the RFC section.
      options:
        - label: This is about RFC-defined protocol behavior (cite the RFC/section in the proposal)
        - label: This is app-level, not protocol